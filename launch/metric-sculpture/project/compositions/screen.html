        const F = {"_note": "Everything that is the product. Timing, eases, camera and the SFX grid live in tools/templates and tools/build.py.", "brand": {"name": "Votrix AI", "logo": "assets/img/votrix-logo.png", "mark": "assets/img/logo-mark.png", "workspace_initials": "VA"}, "metric": {"name": "Monthly views", "unit": 2000, "before": 2000, "after": 200000, "days": 60, "per": "views / month", "after_label": "TODAY", "rule": "1 PLATE = 2,000 VIEWS / MONTH", "verdict": "100×", "verdict_line": "in 60 days, with Votrix SEO", "zero_label": "Marketers hired", "source": "Source: Votrix AI's own monthly views", "before_label": "60 DAYS AGO", "before_tile": "60 days ago"}, "app": {"_note": "Labels copied from the product's real app; never invent one.", "nav": ["New task", "Scheduled", "Integrations"], "team_label": "YOUR TEAM", "agents": [{"id": "riya", "name": "Riya", "role": "SEO & GEO", "img": "assets/img/p-riya.jpg"}, {"id": "rebecca", "name": "Rebecca", "role": "Social media", "img": "assets/img/p-rebecca.jpg"}, {"id": "victor", "name": "Victor", "role": "Lead generation", "img": "assets/img/p-victor.jpg"}, {"id": "maya", "name": "Maya", "role": "Website builder", "img": "assets/img/maya.jpg"}], "hero_agent": "riya", "report_title": "Monthly report", "new_title": "New task", "finished": "finished this task", "card_title": "Visibility report", "card_tag": "LIVE", "done": "Done", "working": "Working", "placeholder": "Ask your team anything…", "hint": "@ mention an agent · attach files", "request": "@Riya get us more views", "task_title": "Get us more views", "rows": ["SEO fixes shipped", "Checked answers in ChatGPT & Perplexity", "Fixed titles, schema & local listings"]}, "palette": {"wall": ["#1f3d31", "#142a20"], "sidebar": "#efe9df", "main": "#f8f5ef", "line": "#e3dccf", "ink": "#1b2620", "muted": "#7a837d", "brand": "#24493a", "active": "#dcefe3", "accent": "#2d5c44", "sweep": "#d8d0c3", "before_plate": "#c8ccd1", "after_plate": "#9fd8b4", "tenth_plate": "#d2b07a"}, "mascot": {"_note": "A new character per film, in a colour no UI uses. 14 x 12 grid; O body, W wing, E eye, K beak, L legs.", "colors": {"O": "#f26b3a", "W": "#c94f25", "E": "#1a1a1a", "K": "#f5c04a", "L": "#1a1a1a"}, "poses": {"stand": ["......OOO.....", ".....OOOOO....", ".....OOEOOKK..", ".....OOOOOK...", "...W.OOOOO....", "..WWOOOOOOO...", ".WWWOOOOOOOO..", "..WWOOOOOOOO..", "....OOOOOOO...", ".....OOOOO....", "......L..L....", ".....LL.LL...."], "tuck": ["......OOO.....", ".WW..OOOOO....", "WWWW.OOEOOKK..", ".WWWWOOOOOK...", "..WWOOOOOO....", "...OOOOOOOO...", "...OOOOOOOOO..", "...OOOOOOOOO..", "....OOOOOOO...", ".....OLOOL....", "..............", ".............."], "cheer": ["WW....OOO...WW", "WWW..OOOOO.WWW", ".WWW.OOEOOKKW.", "..WWWOOOOOKW..", "...WWOOOOOW...", "....OOOOOOO...", "....OOOOOOOO..", "....OOOOOOOO..", "....OOOOOOO...", ".....OOOOO....", "......L..L....", ".....LL.LL...."]}}, "captions": [["Our views just went up a hundred times.", "a"], ["And we never hired a marketer.", "a"], ["We used Votrix SEO.", "a"], ["Sixty days ago: two thousand views a month.", "b"], ["Today: two hundred thousand.", "b"]], "lockup": ["Gets you found on Google and in ChatGPT.", "Free to start."], "voice": {"_note": "Five lines, one file each, placed at fixed slots (see references/RECIPE.md). tools/voice.py writes them.", "voice": "Brian", "lines": ["Our views just went up a hundred times. And we never hired a marketer.", "We used Votrix SEO.", "Sixty days ago: two thousand views a month.", "Today: two hundred thousand.", "Votrix SEO. Gets you found on Google and in ChatGPT. Free to start."], "durations": [4.0, 2.1, 3.1, 2.1, 5.74]}, "music": {"src": "assets/audio/music.mp3", "duration": 20.95, "volume": 0.3}, "hero": {"id": "riya", "name": "Riya", "role": "SEO & GEO", "img": "assets/img/p-riya.jpg"}};
        const POSES = F.mascot.poses;

        const pose = (name, at) => ["stand", "tuck", "cheer"].forEach((p) => tl.set($("#pose-" + p), { opacity: p === name ? 1 : 0 }, at));

        const ROWS = F.app.rows.map((what) => [F.hero.img, F.hero.name, what]);

          const mark = box($("#mark")), t1 = box($("#tile1")), t3 = box($("#tile3")), inp = box($("#input")), bub = box($("#bubble"));

          const snap = (v) => Math.round(v / 2.5) * 2.5;

          // camera: put window point (x, y) at the frame centre at scale s, never past the desktop edges
          const camAt = (x, y, s) => {
            const tx = Math.min(0, Math.max(1920 - 1920 * s, 960 - (240 + x) * s));

          };
          const cam = (at, dur, x, y, s, ease) => tl.to($("#cam"), { ...camAt(x, y, s), duration: dur, ease: ease || "power2.inOut" }, at);

            tl.to($("#sq"), { scaleY: 0.78, scaleX: 1.16, duration: 0.09, ease: "power2.out" }, at);

            tl.to($("#sq"), { scaleY: 1, scaleX: 1, duration: d * 0.5, ease: "power1.out" }, at + 0.17);
            tl.to($("#bird"), { x: x, duration: d, ease: "none", modifiers: { x: (v) => snap(parseFloat(v)) + "px" } }, at + 0.1);
            tl.to($("#bird"), { y: top, duration: d * 0.5, ease: "power2.out", modifiers: { y: (v) => snap(parseFloat(v)) + "px" } }, at + 0.1);
            tl.to($("#bird"), { y: y, duration: d * 0.5, ease: "power2.in", modifiers: { y: (v) => snap(parseFloat(v)) + "px" } }, at + 0.1 + d * 0.5);
            const land = at + 0.1 + d;
            pose("stand", land);
            tl.fromTo($("#sq"), { scaleY: 0.72, scaleX: 1.22 }, { scaleY: 1, scaleX: 1, duration: 0.45, ease: "elastic.out(1.1,0.45)" }, land);
            [-1, -0.4, 0.4, 1].forEach((k, i) => {
              tl.fromTo($("#d" + i), { x: x - 2 + k * 18, y: y - 6, opacity: 1 }, { x: x - 2 + k * 46, y: y - 16 - (i % 2) * 8, opacity: 0, duration: 0.35, ease: "power2.out" }, land);

          };
          const blink = (at) => { tl.set(R.querySelectorAll(".eye"), { opacity: 0 }, at); tl.set(R.querySelectorAll(".eye"), { opacity: 1 }, at + 0.1); };

          // initial states
          tl.set($("#cam"), { x: 0, y: 0, scale: 1 }, 0);
          tl.set($("#bird"), { x: bx, y: by, opacity: 0 }, 0);
          pose("stand", 0);
          tl.set(R.querySelectorAll(".dust"), { opacity: 0 }, 0);
          tl.set(["#t2", "#t3", "#p2", "#rew", "#ff", "#key", "#bubble", "#typed", "#caret"].map($), { opacity: 0 }, 0);
          tl.set(R.querySelectorAll(".agent .on"), { opacity: 0 }, 0);
          tl.set($("#cursor"), { x: 1300, y: 900, opacity: 0 }, 0);
          tl.set(R.querySelectorAll(".row"), { opacity: 0 }, 0);

          // 0.0–4.4 the report
          tl.fromTo($("#win"), { y: 30, scale: 0.97 }, { y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0);
          tl.fromTo($("#card"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.15);

          const cnt = { v: 0 };
          tl.to(cnt, { v: F.metric.after, duration: 1.25, ease: "power2.out", onUpdate: () => { $("#views").textContent = (Math.round(cnt.v / F.metric.unit) * F.metric.unit).toLocaleString("en-US"); } }, 0.4);
          tl.set($("#views"), { textContent: "0" }, 0);
          tl.fromTo($("#x100"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.65);
          cam(0.2, 1.4, t1.x + t1.w * 0.9, t1.y + 40, 1.45);
          // born from the logo mark
          tl.to($("#bird"), { opacity: 1, duration: 0.01 }, 0.55);
          tl.fromTo($("#sq"), { scaleY: 0.2, scaleX: 0.5 }, { scaleY: 1, scaleX: 1, duration: 0.25, ease: "back.out(3)" }, 0.55);

          pose("cheer", 3.75); pose("stand", 4.15);

          // 4.4–6.4 rewind and the request
          tl.to($("#rew"), { opacity: 1, duration: 0.2 }, 4.4);
          tl.to($("#report"), { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power2.in" }, 4.45);
          tl.to(["#t1", "#p1"].map($), { opacity: 0, duration: 0.15 }, 4.5);
          tl.to($("#t2"), { opacity: 1, duration: 0.15 }, 4.6);
          tl.to($("#bird"), { opacity: 0, duration: 0.12 }, 4.5);
          cam(4.45, 0.7, inp.x + 300, inp.y + 40, 1.5);
          tl.to($("#cursor"), { opacity: 1, duration: 0.1 }, 4.5);
          tl.to($("#cursor"), { x: inp.x + 230, y: inp.y + 46, duration: 0.42, ease: "power2.inOut" }, 4.5);
          tl.to($("#cursor"), { scale: 0.85, duration: 0.06, yoyo: true, repeat: 1 }, 4.92);
          tl.to($("#ph"), { opacity: 0, duration: 0.05 }, 5.0);
          tl.to(["#typed", "#caret"].map($), { opacity: 1, duration: 0.01 }, 5.0);
          tl.to($("#rew"), { opacity: 0, duration: 0.2 }, 5.1);
          const text = F.app.request;
          const ctx = document.createElement("canvas").getContext("2d"); ctx.font = "400 20px Geist";
          for (let i = 0; i <= text.length; i++) {
            const at = 5.02 + i * 0.039;
            tl.set($("#typed"), { textContent: text.slice(0, i) }, at);
            tl.set($("#caret"), { left: 24 + ctx.measureText(text.slice(0, i)).width + 2 }, at);
          }
          tl.to($("#cursor"), { opacity: 0, duration: 0.2 }, 5.4);
          // Return
          tl.fromTo($("#key"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.15 }, 5.95);
          tl.to($("#key"), { opacity: 0, duration: 0.2 }, 6.5);
          tl.fromTo($("#send"), { scale: 1 }, { scale: 0.86, duration: 0.07, yoyo: true, repeat: 1 }, 6.0);
          tl.set(["#typed", "#caret"].map($), { opacity: 0 }, 6.02);
          tl.set($("#ph"), { opacity: 1 }, 6.02);
          // the bubble flies from the input into the thread; the mascot rides it
          const fromY = inp.y - bub.y + 10;
          tl.set($("#bubble"), { opacity: 1 }, 6.02);
          tl.fromTo($("#bubble"), { y: fromY, scale: 0.9 }, { y: 0, scale: 1, duration: 0.38, ease: "power3.out" }, 6.02);
          tl.set($("#bird"), { x: snap(bub.x + bub.w * 0.5), y: snap(bub.y + fromY) }, 5.98);
          tl.to($("#bird"), { opacity: 1, duration: 0.01 }, 6.0);
          tl.fromTo($("#sq"), { scaleY: 0.3 }, { scaleY: 1, duration: 0.2, ease: "back.out(3)" }, 6.0);
          tl.to($("#bird"), { y: bub.y, duration: 0.38, ease: "power3.out", modifiers: { y: (v) => snap(parseFloat(v)) + "px" } }, 6.02);
          by = bub.y; bx = bub.x + bub.w * 0.5;
          tl.to(["#t2"].map($), { opacity: 0, duration: 0.12 }, 6.05);
          tl.to(["#t3", "#p2"].map($), { opacity: 1, duration: 0.15 }, 6.1);
          cam(6.0, 0.6, 860, 230, 1.2);
          tl.to($("#on-" + F.hero.id), { opacity: 1, duration: 0.2 }, 6.3);
          tl.to($("#st-" + F.hero.id), { backgroundColor: "#2f9e62", duration: 0.2 }, 6.3);

          // 6.4–7.6 time-lapse: 60 days
          tl.fromTo($("#ff"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, 6.4);
          const day = { v: 1 };
          tl.to(day, { v: F.metric.days, duration: 1.1, ease: "power1.in", onUpdate: () => { $("#day").textContent = "Day " + Math.round(day.v); } }, 6.45);
          tl.set($("#day"), { textContent: "Day 1" }, 0);
          for (let i = 0; i < 10; i++) {
            tl.fromTo($("#row" + i), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.14, ease: "expo.out" }, 6.45 + i * 0.11);
          }
          tl.to($("#rows"), { y: -230, duration: 0.8, ease: "power1.in" }, 6.85);
          tl.to($("#bubble"), { y: -230, duration: 0.8, ease: "power1.in" }, 6.85);
          const r1 = rowBox(1), r2 = rowBox(2);
          jump(6.5, r1.x + 330, r1.y, 70, 0.3);
          tl.to($("#bird"), { y: "-=230", duration: 0.8, ease: "power1.in", modifiers: { y: (v) => snap(parseFloat(v)) + "px" } }, 6.85);
          tl.to($("#bird"), { x: r2.x + 620, duration: 0.6, ease: "none", modifiers: { x: (v) => snap(parseFloat(v)) + "px" } }, 6.95);
          // 7.5 whip left
          tl.to($("#cam"), { x: "-=2300", duration: 0.42, ease: "power3.in" }, 7.48);
          tl.to($("#blur"), { filter: "blur(18px)", duration: 0.3, ease: "power2.in" }, 7.55);
          tl.to(["#ff"].map($), { opacity: 0, duration: 0.15 }, 7.5);
          tl.to($("#blur"), { opacity: 0, duration: 0.25, ease: "power1.in" }, 7.65);

          window.__timelines = window.__timelines || {};
          window.__timelines["screen"] = tl;
        });
      })();
    </script>
  </div>
</template>
