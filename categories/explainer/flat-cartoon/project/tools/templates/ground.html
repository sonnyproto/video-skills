        </svg>
      <img id="b-imgfar" class="b-layer" src="{{images.far.src}}" alt="" style="top:-70px" />

      <svg id="b-svg2" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="c-dusk" x1="0" y1="0" x2="0" y2="1">

          <linearGradient id="c-nightsky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#05021d" />

          </linearGradient>
          <radialGradient id="c-sunset" cx="50%" cy="50%" r="50%">

          <filter id="c-b60" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="60" /></filter>

          <clipPath id="c-hoodclip"><path d="M-74 -84 L-64 -205 Q-58 -238 -24 -240 L24 -240 Q58 -238 64 -205 L74 -84 Q74 -76 64 -76 L-64 -76 Q-74 -76 -74 -84 Z" /></clipPath>
          <clipPath id="c-headclip"><circle cx="0" cy="-74" r="66" /></clipPath>
          <clipPath id="c-treeclip"><circle cx="0" cy="-175" r="80" /><circle cx="-56" cy="-128" r="56" /><circle cx="56" cy="-126" r="54" /></clipPath>
          <clipPath id="c-midclip"><path d="M0 760 C260 700 520 720 760 750 C1000 780 1300 700 1560 712 C1720 720 1840 700 1920 716 L1920 1080 L0 1080 Z" /></clipPath>
        </defs>
        <g id="b-frost" opacity="0"></g>
        <!-- character, feet at (1080, 828); key light from the left -->
        <g transform="translate(1010 968)">
          <g id="b-wrap" style="filter: brightness(1)">
            <ellipse id="b-cast" cx="70" cy="4" rx="120" ry="13" fill="#170a36" opacity="0.6" filter="url(#c-b3)" />
            <g id="b-guy">
              <rect x="-36" y="-92" width="26" height="92" rx="12" fill="#2a2f6a" />
              <rect x="10" y="-92" width="26" height="92" rx="12" fill="#2a2f6a" />
              <rect x="22" y="-92" width="14" height="92" rx="7" fill="#1b1d4f" />
              <ellipse cx="-24" cy="-2" rx="24" ry="11" fill="#f7f3ff" /><ellipse cx="24" cy="-2" rx="24" ry="11" fill="#f7f3ff" />
              <ellipse cx="30" cy="1" rx="18" ry="7" fill="#c9bfe8" />
              <g transform="translate(-66 -212)"><g id="b-armLr">
                <rect x="-14" y="0" width="28" height="112" rx="14" fill="{{palette.character_main}}" />
                <rect x="-14" y="0" width="6" height="104" rx="3" fill="#ffd27a" opacity="0.85" class="b-rimwarm" />
                <circle cx="0" cy="114" r="15" fill="#f2c29b" />
              </g></g>
              <g transform="translate(66 -212)"><g id="b-armRr">
                <rect x="-14" y="0" width="28" height="112" rx="14" fill="{{palette.character_shadow}}" />
                <circle cx="0" cy="114" r="15" fill="#c98a78" />
              </g></g>
              <!-- hoodie: base / shadow block / rim -->
              <path d="M-74 -84 L-64 -205 Q-58 -238 -24 -240 L24 -240 Q58 -238 64 -205 L74 -84 Q74 -76 64 -76 L-64 -76 Q-74 -76 -74 -84 Z" fill="{{palette.character_main}}" />
              <g clip-path="url(#c-hoodclip)">
                <path d="M18 -250 C50 -200 40 -130 30 -70 L90 -70 L90 -250 Z" fill="{{palette.character_shadow}}" />
                <path d="M-80 -250 L-60 -250 L-70 -70 L-80 -70 Z" fill="#ffd27a" opacity="0.9" class="b-rimwarm" />
                <path d="M60 -250 L90 -250 L90 -70 L72 -70 Z" fill="#9ab8ff" opacity="0" class="b-rimcool" />
              </g>
              <rect x="-34" y="-140" width="68" height="34" rx="14" fill="#25a596" />
              <rect x="10" y="-140" width="24" height="34" rx="10" fill="#1a6f84" />
              <line x1="-12" y1="-236" x2="-14" y2="-190" stroke="#f7f3ff" stroke-width="5" stroke-linecap="round" />
              <line x1="12" y1="-236" x2="14" y2="-190" stroke="#c9d6f0" stroke-width="5" stroke-linecap="round" />
              <!-- head -->
              <g transform="translate(0 -244)">
                <g id="b-head">
                  <rect x="-14" y="-20" width="28" height="26" rx="8" fill="#c98a78" />
                  <circle cx="-64" cy="-70" r="14" fill="#f2c29b" />
                  <circle cx="64" cy="-70" r="14" fill="#c98a78" />
                  <circle cx="0" cy="-74" r="66" fill="#f2c29b" />
                  <g clip-path="url(#c-headclip)">
                    <circle cx="40" cy="-60" r="70" fill="#d7957f" opacity="0.8" />
                    <path d="M-70 -140 L-58 -140 L-62 -10 L-70 -10 Z" fill="#ffe0a0" opacity="0.9" class="b-rimwarm" />
                    <path d="M58 -140 L72 -140 L72 -10 L62 -10 Z" fill="#9ab8ff" opacity="0" class="b-rimcool" />
                  </g>
                  <path d="M-66 -82 C-70 -140 -20 -160 10 -150 C50 -160 80 -120 66 -84 C50 -110 20 -118 -10 -110 C-30 -120 -50 -108 -66 -82 Z" fill="#3a2244" />
                  <path d="M-52 -112 C-40 -136 -10 -146 8 -140" fill="none" stroke="#7a4f8a" stroke-width="6" stroke-linecap="round" />
                  <ellipse cx="-38" cy="-50" rx="12" ry="7" fill="#ff7a8a" opacity="0.5" />
                  <ellipse cx="38" cy="-50" rx="12" ry="7" fill="#ff7a8a" opacity="0.4" />
                  <g id="b-browL"><path d="M-36 -104 Q-24 -110 -12 -104" fill="none" stroke="#3a2244" stroke-width="6" stroke-linecap="round" /></g>
                  <g id="b-browR"><path d="M12 -104 Q24 -110 36 -104" fill="none" stroke="#3a2244" stroke-width="6" stroke-linecap="round" /></g>
                  <g id="b-eyes">
                    <ellipse cx="-24" cy="-78" rx="14" ry="17" fill="#ffffff" />
                    <ellipse cx="24" cy="-78" rx="14" ry="17" fill="#f1ecff" />
                    <g id="b-pupils">
                      <circle id="b-pL" cx="-26" cy="-76" r="8" fill="#1d1640" />
                      <circle id="b-pR" cx="22" cy="-76" r="8" fill="#1d1640" />
                      <circle cx="-23" cy="-80" r="2.6" fill="#fff" /><circle cx="25" cy="-80" r="2.6" fill="#fff" />
                    </g>
                  </g>
                  <path id="b-smile" d="M-14 -34 Q0 -24 14 -34" fill="none" stroke="#7a3a4a" stroke-width="5" stroke-linecap="round" />
                  <ellipse id="b-oh" cx="0" cy="-30" rx="10" ry="13" fill="#4a1f3a" opacity="0" />
                </g>
              </g>
            </g>
            <!-- breath puffs -->
            <g id="b-breath">
              <circle id="b-br1" cx="-6" cy="-270" r="14" fill="#e8f0ff" opacity="0" filter="url(#c-b3)" />
              <circle id="b-br2" cx="4" cy="-276" r="10" fill="#e8f0ff" opacity="0" filter="url(#c-b3)" />
              <circle id="b-br3" cx="-2" cy="-268" r="12" fill="#e8f0ff" opacity="0" filter="url(#c-b3)" />
            </g>
          </g>
        </g>

        <!-- foreground: blurred big shapes for depth -->
        <g id="b-fg">
          <path d="M-60 1100 C40 940 220 900 380 960 C470 995 520 1060 540 1100 Z" fill="#12082e" filter="url(#c-b8)" />
          <path d="M1700 1100 C1760 1000 1880 960 1990 990 L1990 1100 Z" fill="#12082e" filter="url(#c-b8)" />
        </g>
      </svg>
    </div>
    <svg id="b-fx" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="b-grain"><feTurbulence id="b-turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5" /><feColorMatrix type="saturate" values="0" /></filter>
        <radialGradient id="b-vig" cx="50%" cy="50%" r="75%">
          <stop offset="0.55" stop-color="#05021d" stop-opacity="0" />
          <stop offset="1" stop-color="#05021d" stop-opacity="0.6" />
        </radialGradient>
      </defs>
      <rect width="1920" height="1080" fill="url(#b-vig)" />
      <rect width="1920" height="1080" filter="url(#b-grain)" opacity="0.06" style="mix-blend-mode: overlay" />
    </svg>
    <div id="b-cap">
      <div id="b-l1">{{copy.caption_1}}</div>
      <div id="b-l2">{{copy.caption_2}}</div>
    </div>
  </div>
  <script>
    (function () {
      let s = 23;
      const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
      const ns = 'http://www.w3.org/2000/svg';
      const mk = (tag, attrs, parent) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const tints = ['#ffffff', '#ffffff', '#d9c8ff', '#bfe9ff', '#ffe7c2'];
      const sg = document.querySelector('#b-stars');
      const stars = [];
      for (let i = 0; i < 200; i++) stars.push(mk('circle', { cx: (rnd() * 1920).toFixed(1), cy: (rnd() * 680).toFixed(1), r: (0.5 + rnd() * rnd() * 2.4).toFixed(2), fill: tints[Math.floor(rnd() * tints.length)], opacity: (0.35 + rnd() * 0.6).toFixed(2) }, sg));
      const fg = document.querySelector('#b-frost');
      const frost = [];
      for (let i = 0; i < 22; i++) {
        const x = 120 + rnd() * 1500, y = 985 + rnd() * 80;
        frost.push(mk('path', { d: `M${x} ${y - 7} L${x + 1.5} ${y - 1.5} L${x + 7} ${y} L${x + 1.5} ${y + 1.5} L${x} ${y + 7} L${x - 1.5} ${y + 1.5} L${x - 7} ${y} L${x - 1.5} ${y - 1.5} Z`, fill: '#cfe6ff', opacity: 0 }, fg));
      }

      const tl = gsap.timeline({ paused: true });
      const E = 'sine.inOut';
      // camera push + parallax layers
      tl.fromTo('#b-cam', { scale: 1.0 }, { scale: 1.08, duration: 4.6, ease: E, transformOrigin: '56% 62%' }, 0);
      tl.fromTo('#b-imgfar', { x: 0 }, { x: 16, duration: 4.6, ease: E }, 0);
      tl.fromTo('#b-imgmid', { x: 0 }, { x: 6, duration: 4.6, ease: E }, 0);
      tl.fromTo('#b-imgnear', { x: 0 }, { x: -8, duration: 4.6, ease: E }, 0);
      tl.fromTo('#b-fg', { x: 0 }, { x: -40, duration: 5, ease: E }, 0);
      tl.fromTo('#b-rays', { rotation: -2 }, { rotation: 2, svgOrigin: '0 0', duration: 1.6, ease: E }, 0);
      tl.fromTo('#b-turb', { attr: { seed: 1 } }, { attr: { seed: 150 }, duration: 5, ease: 'none' }, 0);

      // idle: breath, offset arms, gaze at the sunset, blink
      tl.fromTo('#b-guy', { scaleY: 1, scaleX: 1, transformOrigin: '50% 100%' }, { scaleY: 1.012, duration: 0.9, yoyo: true, repeat: 1, ease: E }, 0);
      tl.fromTo('#b-armLr', { rotation: 3 }, { rotation: -2, svgOrigin: '0 0', duration: 1.1, ease: E }, 0);
      tl.fromTo('#b-armRr', { rotation: -2 }, { rotation: 3, svgOrigin: '0 0', duration: 1.3, ease: E }, 0.15);
      tl.fromTo('#b-pupils', { x: -6, y: 2 }, { x: -7, y: 2, duration: 0.6 }, 0);
      tl.fromTo('#b-eyes', { scaleY: 1, transformOrigin: '50% 50%' }, { scaleY: 0.1, duration: 0.07, ease: 'power1.in' }, 0.7);
      tl.to('#b-eyes', { scaleY: 1, duration: 0.1, ease: 'power1.out' }, 0.77);

      // captions
      tl.fromTo('#b-l1', { opacity: 0, y: 20 }, { opacity: 0.9, y: 0, duration: 0.6, ease: 'power3.out' }, 0.2);
      tl.fromTo('#b-l2', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 1.75);

      // the light goes out
      const L = 1.5;
      tl.fromTo('#b-sunin', { opacity: 1, scale: 1, transformOrigin: '50% 50%' }, { opacity: 0, scale: 0.55, duration: 0.8, ease: 'power2.in' }, L);
      tl.fromTo('#b-night', { opacity: 0 }, { opacity: 1, duration: 1.1, ease: 'power2.inOut' }, L);
      tl.fromTo('#b-imgfar', { filter: 'brightness(1) saturate(1)' }, { filter: 'brightness(0.3) saturate(0.8)', duration: 1.1, ease: E }, L);
      tl.fromTo('#b-imgmid', { filter: 'brightness(1) saturate(1)' }, { filter: 'brightness(0.42) saturate(0.85)', duration: 1.1, ease: E }, L + 0.05);
      tl.fromTo('#b-imgnear', { filter: 'brightness(1) saturate(1)' }, { filter: 'brightness(0.5) saturate(0.9)', duration: 1.1, ease: E }, L + 0.1);
      tl.fromTo('.b-rimwarm', { opacity: 0.85 }, { opacity: 0, duration: 0.7, ease: 'power2.in' }, L);
      tl.fromTo('#b-wrap', { filter: 'brightness(1)' }, { filter: 'brightness(0.74)', duration: 1.1, ease: E }, L);
      tl.fromTo('#b-cast', { opacity: 0.6, scaleX: 1 }, { opacity: 0.25, scaleX: 0.7, transformOrigin: '50% 50%', duration: 1.0, ease: E }, L);
      tl.fromTo('.b-rimcool', { opacity: 0 }, { opacity: 0.55, duration: 1.0, ease: E }, L + 0.6);
      tl.fromTo('#b-stars', { opacity: 0 }, { opacity: 1, duration: 1.4, ease: 'sine.in' }, L + 0.5);
      tl.fromTo('#b-neb', { opacity: 0 }, { opacity: 1, duration: 1.6, ease: 'sine.in' }, L + 0.6);
      stars.forEach((st, i) => { if (i % 8) return; tl.fromTo(st, { opacity: 0.25 }, { opacity: 1, duration: 0.5 + (i % 4) * 0.15, yoyo: true, repeat: 2, ease: E }, 2.2 + (i % 9) * 0.1); });

      // the take
      const T = 2.0;
      tl.fromTo('#b-guy', { scaleY: 1.012, scaleX: 1 }, { scaleY: 0.95, scaleX: 1.03, duration: 0.14, ease: 'power2.in', immediateRender: false }, T);
      tl.to('#b-guy', { scaleY: 1.05, scaleX: 0.97, duration: 0.14, ease: 'power2.out' }, T + 0.14);
      tl.to('#b-guy', { scaleY: 1, scaleX: 1, duration: 0.5, ease: 'elastic.out(1, 0.45)' }, T + 0.28);
      tl.fromTo('#b-head', { y: 0, rotation: 0 }, { y: -10, rotation: -6, svgOrigin: '0 0', duration: 0.22, ease: 'back.out(3)' }, T + 0.06);
      tl.fromTo('#b-pupils', { x: -7, y: 2 }, { x: 0, y: -6, duration: 0.18, ease: 'power2.out', immediateRender: false }, T + 0.05);
      tl.fromTo('#b-pL', { scale: 1 }, { scale: 0.65, transformOrigin: '50% 50%', duration: 0.18 }, T + 0.1);
      tl.fromTo('#b-pR', { scale: 1 }, { scale: 0.65, transformOrigin: '50% 50%', duration: 0.18 }, T + 0.12);
      tl.fromTo('#b-browL', { y: 0, rotation: 0 }, { y: -12, rotation: -6, svgOrigin: '-24 -106', duration: 0.2, ease: 'back.out(3)' }, T + 0.08);
      tl.fromTo('#b-browR', { y: 0, rotation: 0 }, { y: -14, rotation: 6, svgOrigin: '24 -106', duration: 0.2, ease: 'back.out(3)' }, T + 0.11);
      tl.fromTo('#b-smile', { opacity: 1 }, { opacity: 0, duration: 0.08 }, T + 0.1);
      tl.fromTo('#b-oh', { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: 1, transformOrigin: '50% 50%', duration: 0.2, ease: 'back.out(3)' }, T + 0.1);
      tl.fromTo('#b-armLr', { rotation: -2 }, { rotation: 22, svgOrigin: '0 0', duration: 0.22, ease: 'back.out(2.5)', immediateRender: false }, T + 0.12);
      tl.fromTo('#b-armRr', { rotation: 3 }, { rotation: -18, svgOrigin: '0 0', duration: 0.24, ease: 'back.out(2.5)', immediateRender: false }, T + 0.2);

      // cold: frost sparkles + breath puffs; arms come in, a shiver
      frost.forEach((f, i) => tl.fromTo(f, { opacity: 0, scale: 0, transformOrigin: '50% 50%' }, { opacity: 0.9, scale: 1, duration: 0.3, ease: 'back.out(2)' }, 3.2 + (i % 11) * 0.08));
      tl.fromTo('#b-frost', { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.15);
      const puff = (sel, t, dx) => {
        tl.fromTo(sel, { opacity: 0, x: 0, y: 0, scale: 0.4, transformOrigin: '50% 50%' }, { opacity: 0.85, x: dx * 0.4, y: -14, scale: 1, duration: 0.25, ease: 'power2.out' }, t);
