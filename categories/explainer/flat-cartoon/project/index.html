<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>What if the Sun disappeared?</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0628; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="space" data-composition-id="space" data-composition-src="compositions/space.html"
        data-start="0" data-duration="5.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="ground" data-composition-id="ground" data-composition-src="compositions/ground.html"
        data-start="5.4" data-duration="4.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <audio id="sound" class="clip" src="assets/audio/sound.mp3" data-start="0" data-duration="10" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
